version: '3.8'

services:
  db:
    image: postgres:15
    container_name: horse_owner_db
    restart: always
    environment:
      POSTGRES_DB: horse_owner
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: